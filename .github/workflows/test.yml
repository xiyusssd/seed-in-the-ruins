name: Game checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.5
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfontconfig1 libxkbcommon0 libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libgl1 libvulkan1 libasound2 libpulse0
          curl -fL --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.5-stable/Godot_v4.5-stable_linux.x86_64.zip
          echo 'c7316e1fd782ad276a4d985a7673b5976eaaa8d90561a2bea5289210dc53e9ba  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp/godot
      - name: Import and test
        run: |
          /tmp/godot/Godot_v4.5-stable_linux.x86_64 --headless --editor --path game --import --quit
          python3 tools/run_later_visibility_checks.py --engine /tmp/godot/Godot_v4.5-stable_linux.x86_64 --version 1.14.0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: game-check-results
          path: |
            builds/v1140-*-tests.log
            builds/v1140-test-summary.json
